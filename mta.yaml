_schema-version: "3.1.0"
ID: maco-mmt-srv-cpi-delivery
version: 1.0.0

modules:
  - name: mmt.devops.srv.cpi.delivery
    type: go
    path: .
    parameters:
      memory: 1024M
      disk-quota: 1024M
      hosts:
        - com-sap-maco-mmt-srv-devops-cpi-delivery
      instances: 1
    requires:
      - name: mmt-devops-pgsql
      - name: mmt_devops_destination
      - name: mmt-tms
      - name: mmt_devops_connectivity
      - name: uaa-api
    properties:
      REMOTE: true

resources:
  - name: mmt-devops-pgsql
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: development
  - name: mmt_devops_destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: mmt-tms
    type: org.cloudfoundry.managed-service
    parameters:
      service: transport
      service-plan: standard
  - name: mmt_devops_connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: uaa-api
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: apiaccess
