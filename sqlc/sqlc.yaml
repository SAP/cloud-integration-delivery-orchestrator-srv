version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "users-schema.sql"
    database:
      uri: "postgres://postgres:passw0rd@127.0.0.1:5432/macodeploy?sslmode=disable"
    gen:
      go:
        out: "../db"
        package: "db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true