version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "schema.sql"
    database:
      uri: "postgres://postgres:passw0rd@127.0.0.1:5432/macodeploy?sslmode=disable"
    gen:
      go:
        out: "../db"
        package: "db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        overrides:
          - go_type:
              type: "int"
            db_type: "serial"
          - go_type:
              type: "int"
            db_type: "serial4"
          - go_type:
              type: "int"
            db_type: "pg_catalog.serial4"
          - go_type:
              type: "int"
            db_type: "integer"
          - go_type:
              type: "int"
            db_type: "int"
          - go_type:
              type: "int"
            db_type: "int4"
          - go_type:
              type: "int"
            db_type: "pg_catalog.int4"
          - go_type: "time.Time"
            db_type: "timestamptz"
          - go_type: "string"
            db_type: "varchar"
